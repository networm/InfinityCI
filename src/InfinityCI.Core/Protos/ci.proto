syntax = "proto3";

option csharp_namespace = "InfinityCI.Grpc";

package infinityci.v1;

// Agents always initiate the connection (NAT/firewall friendly) and pull work
// when they have free capacity. One bidi stream per agent process.
service AgentHub {
  rpc Connect(stream AgentToMaster) returns (stream MasterToAgent);
}

message AgentRegistration {
  string agent_id = 1;            // stable id, generated once and persisted by the agent
  string agent_name = 2;
  string version = 3;
  repeated string labels = 4;
  int32 max_concurrent_builds = 5;
  string enroll_token = 6;        // one-time enrollment token (first registration)
}

message AgentStats {
  double cpu_percent = 1;
  double memory_percent = 2;
  int64 free_disk_bytes = 3;
}

// One console line of a job log. Line offsets are line indexes into the job's
// JSONL log on the master; timestamps are assigned by the master on append.
message LogChunk {
  int64 run_id = 1;
  int64 job_run_id = 2;
  string job_key = 3;
  int32 step_index = 4;
  int64 offset = 5;
  string text = 6;
}

message StepUpdate {
  int64 run_id = 1;
  int64 job_run_id = 2;
  string job_key = 3;
  int32 step_index = 4;
  string status = 5;              // Pending/Running/Success/Failed/Skipped/Cancelled
  optional int32 exit_code = 6;
  int64 start_line = 7;
  int64 end_line = 8;
}

message JobFinished {
  int64 run_id = 1;
  int64 job_run_id = 2;
  string job_key = 3;
  string status = 4;              // Success/Failed/Cancelled
  optional int32 exit_code = 5;
}

message ScmCheckout {
  int64 run_id = 1;
  int64 job_run_id = 2;
  string job_key = 3;
  string branch = 4;
  string commit_sha = 5;
}

message AgentToMaster {
  oneof payload {
    AgentRegistration register = 1;
    AgentStats stats = 2;
    bool request_job = 3;         // pull: agent declares it has a free slot
    LogChunk log_chunk = 4;
    StepUpdate step_update = 5;
    JobFinished job_finished = 6;
    ScmCheckout scm_checkout = 7;
  }
}

message JobAssignment {
  int64 run_id = 1;
  int64 job_run_id = 2;
  string job_key = 3;
  string workflow_name = 4;
  string workflow_yaml = 5;       // full workflow YAML; the agent runs jobs[job_key]
  string scm_url = 6;             // present when the workflow declares an scm block
  string scm_branch = 7;
  string scm_ref = 8;
  string scm_username = 9;        // resolved credential (empty when anonymous)
  string scm_password = 10;
  string params_json = 11;        // run parameters (name -> value), exported as env vars
  string env_json = 12;           // agent-wide environment variables (name -> value), lowest env priority
  string workspace = 13;          // working-directory override (runtime state): absolute, or relative to the agent data dir
}

message MasterToAgent {
  oneof payload {
    bool register_ack = 1;
    JobAssignment assignment = 2;
    int64 cancel_job_run = 3;     // job run id to cancel
  }
}
